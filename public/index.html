<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="鳩山春子『婦人の修養』の電子版を、ブラウザで縦書きのまま読めるリーダーです。">
<title>婦人の修養 — 鳩山春子</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="reader.css">
<script src="reader.js" type="module"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-toc" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M3 19 8.5 5h1L15 19M5.2 14h7.6M15.5 19l3.2-8h.6l3.2 8M16.6 16.4h4.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
</svg>

<div id="loader" role="status" aria-live="polite">
    <div class="loader-mark">
        <span class="loader-title">婦人の修養</span>
        <span class="loader-author">鳩山春子</span>
    </div>
    <div class="loader-bar"><div id="loader-progress"></div></div>
    <p id="loader-message">本を読み込んでいます…</p>
    <button id="loader-retry" class="text-button" hidden>もう一度読み込む</button>
</div>

<main id="stage" aria-label="本文">
    <div id="viewport"><div id="content" class="epub-body"></div></div>
    <div id="running-head" aria-hidden="true"></div>
    <div id="folio" aria-hidden="true"></div>
    <button class="edge-nav edge-left" id="edge-left" tabindex="-1"><svg class="icon"><use href="#i-left"/></svg></button>
    <button class="edge-nav edge-right" id="edge-right" tabindex="-1"><svg class="icon"><use href="#i-right"/></svg></button>
</main>

<header id="topbar" class="chrome">
    <button id="toc-button" class="icon-button" aria-label="目次" title="目次 (T)" aria-controls="toc-panel">
        <svg class="icon"><use href="#i-toc"/></svg>
    </button>
    <div class="topbar-title">
        <span id="book-title"></span>
        <span id="book-author"></span>
    </div>
    <button id="search-button" class="icon-button" aria-label="本文検索" title="本文検索 (/)" aria-controls="search-panel">
        <svg class="icon"><use href="#i-search"/></svg>
    </button>
    <button id="settings-button" class="icon-button" aria-label="表示設定" title="表示設定" aria-controls="settings-panel" aria-expanded="false">
        <svg class="icon"><use href="#i-type"/></svg>
    </button>
</header>

<footer id="bottombar" class="chrome">
    <div class="bottombar-info">
        <span id="chapter-label"></span>
        <span id="progress-label"></span>
    </div>
    <div class="bottombar-slider">
        <input id="slider" type="range" min="0" max="1000" step="1" value="0" aria-label="読書位置">
        <output id="slider-preview" hidden></output>
    </div>
</footer>

<div id="scrim" hidden></div>

<aside id="toc-panel" class="panel panel-start" role="dialog" aria-modal="true" aria-labelledby="toc-heading" hidden>
    <div class="panel-header">
        <h2 id="toc-heading">目次</h2>
        <button class="icon-button" data-close aria-label="閉じる"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body">
        <div class="book-card">
            <img id="cover-thumb" alt="">
            <div>
                <p class="book-card-title" id="card-title"></p>
                <p class="book-card-author" id="card-author"></p>
            </div>
        </div>
        <nav aria-label="章"><ol id="toc-list" class="toc-list"></ol></nav>
        <details class="credits">
            <summary>電子版制作</summary>
            <ul id="credits"></ul>
        </details>
    </div>
</aside>

<aside id="search-panel" class="panel panel-end" role="dialog" aria-modal="true" aria-labelledby="search-heading" hidden>
    <div class="panel-header">
        <h2 id="search-heading">本文検索</h2>
        <button class="icon-button" data-close aria-label="閉じる"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <form id="search-form" class="search-form" role="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="語句を入力" autocomplete="off" enterkeyhint="search" aria-label="検索語">
    </form>
    <p id="search-status" class="search-status" aria-live="polite"></p>
    <ol id="search-results" class="search-results"></ol>
</aside>

<div id="settings-panel" class="popover" role="dialog" aria-label="表示設定" hidden>
    <div class="setting">
        <span class="setting-label">文字サイズ</span>
        <div class="stepper">
            <button id="font-smaller" aria-label="文字を小さく">A<small>−</small></button>
            <output id="font-size-value"></output>
            <button id="font-larger" aria-label="文字を大きく">A<small>＋</small></button>
        </div>
    </div>
    <div class="setting">
        <span class="setting-label">行間</span>
        <div class="segmented" data-setting="lineHeight">
            <button data-value="tight">狭め</button>
            <button data-value="normal">標準</button>
            <button data-value="loose">広め</button>
        </div>
    </div>
    <div class="setting">
        <span class="setting-label">書体</span>
        <div class="segmented" data-setting="font">
            <button data-value="mincho" class="font-mincho">明朝</button>
            <button data-value="gothic" class="font-gothic">ゴシック</button>
        </div>
    </div>
    <div class="setting">
        <span class="setting-label">組方向</span>
        <div class="segmented" data-setting="writing">
            <button data-value="vertical">縦書き</button>
            <button data-value="horizontal">横書き</button>
        </div>
    </div>
    <div class="setting">
        <span class="setting-label">ふりがな</span>
        <div class="segmented" data-setting="ruby">
            <button data-value="on">表示</button>
            <button data-value="off">隠す</button>
        </div>
    </div>
    <div class="setting">
        <span class="setting-label">背景</span>
        <div class="segmented swatches" data-setting="theme">
            <button data-value="auto"><span class="swatch swatch-auto"></span>自動</button>
            <button data-value="light"><span class="swatch swatch-light"></span>白</button>
            <button data-value="sepia"><span class="swatch swatch-sepia"></span>生成り</button>
            <button data-value="dark"><span class="swatch swatch-dark"></span>夜</button>
        </div>
    </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
